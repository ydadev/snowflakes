name: Checks

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Neutral build paths
        shell: pwsh
        run: |
          Import-Module ./tools/BuildPaths.psm1 -Force
          $sfFlags = Get-SnowRustFlags -Root $PWD.Path
          "CARGO_ENCODED_RUSTFLAGS=$sfFlags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Resource collector tests
        shell: pwsh
        run: |
          ./tools/test-resources.ps1
          ./tools/test-frames.ps1
          ./tools/test-build-paths.ps1
      - name: Resource collector tests (Windows PowerShell)
        shell: powershell
        run: |
          ./tools/test-resources.ps1
          ./tools/test-frames.ps1
          ./tools/test-build-paths.ps1
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Client artifact paths and PE
        shell: pwsh
        run: ./tools/check-client-artifact.ps1
      - name: Release cursor force oracle
        run: cargo test -p snowflakes-client --release --locked --lib snow::cursor_tests -- --test-threads=1
      - name: Release adaptive quality decisions
        run: cargo test -p snowflakes-client --release --locked --lib quality::adaptive::tests
      - name: Release adaptive quality physics
        run: cargo test -p snowflakes-client --release --locked --test adaptive_quality
      - name: Release cursor sampling cadence
        run: cargo test -p snowflakes-client --release --locked --lib cursor_cadence
      - name: Headless model benchmark smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario baseline --steps 120 --warmup 30
      - name: Headless contact workload smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario contact-stress --steps 60 --warmup 0
      - name: Headless global contact workload smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario contact-global --steps 60 --warmup 0
      - name: Headless continuous contact workload smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario contact-stream --steps 360 --warmup 0
      - name: Headless synthetic cursor workload smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario cursor-stream --steps 360 --warmup 0 --cursor enabled
      - name: Headless synthetic cursor control smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario cursor-stream --steps 360 --warmup 0 --cursor disabled
      - name: Headless hidden material workload smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario hidden-stream --steps 360 --warmup 120 --cursor enabled
      - name: Headless hidden material control smoke
        run: cargo run -p snowflakes-client --release --locked --example snow_model_bench -- --scenario hidden-stream --steps 360 --warmup 120 --cursor disabled

  contract-and-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: JSON Schema
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:schema
      - name: PHP 8.3 and SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php8.3-cli php8.3-sqlite3
          php8.3 -v
      - name: PHP syntax
        run: |
          for file in server/app/*.php server/public/*.php server/tests/*.php; do
            php8.3 -l "$file" || exit 1
          done
      - name: PHP contract and database
        run: php8.3 server/tests/run.php
      - name: Local HTTP API
        run: php8.3 server/tests/http.php
