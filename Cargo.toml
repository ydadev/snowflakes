[workspace]
members = ["crates/snowflakes-client", "crates/snowflakes-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ydadev/snowflakes"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snowflakes-protocol = { path = "crates/snowflakes-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
